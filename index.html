<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRA中央競馬 AI出馬表ポータル製品版</title>
    <style>
        /* 高級ブラックゴールド調のVIP商用デザイン */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #111111; color: #dddddd; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 550px; margin: 0 auto; background: #1a1a1a; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #d4af37; }
        h1 { font-size: 1.4rem; color: #d4af37; margin-bottom: 5px; font-weight: bold; }
        .subtitle { text-align: center; font-size: 0.8rem; color: #aa8822; margin-bottom: 20px; font-weight: bold; }
        .lock-box { background-color: #222222; border: 1px solid #d4af37; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .pass-input { width: 85%; max-width: 200px; padding: 10px; font-size: 1.1rem; text-align: center; background: #111; color: #fff; border: 1px solid #aa8822; border-radius: 6px; font-weight: bold; }
        .selector-box { background-color: #222222; border: 1px solid #333333; padding: 18px; border-radius: 12px; margin-bottom: 20px; text-align: left; }
        .selector-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 12px; color: #d4af37; border-left: 3px solid #d4af37; padding-left: 8px; }
        .select-input, .text-input { width: 100%; padding: 12px; font-size: 1rem; border-radius: 8px; border: 1px solid #444444; margin-bottom: 15px; background: #111; color: #fff; box-sizing: border-box; }
        .text-input { text-align: center; font-weight: bold; }
        .btn-predict { width: 100%; background: linear-gradient(135deg, #e53e3e 0%, #9b2c2c 100%); color: white; border: none; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 #6b1d1d; }
        .result-report-card { background: #2a2415; border: 1px solid #d4af37; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: left; }
        .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .report-item { background: #111; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #333; }
        .report-val { font-weight: bold; font-size: 1.1rem; margin-top: 4px; }
        .prediction-box { background: linear-gradient(135deg, #251c1c 0%, #1a1515 100%); border: 2px solid #e53e3e; padding: 15px; border-radius: 12px; margin-top: 20px; text-align: left; }
        .prediction-header { color: #d4af37; font-weight: bold; font-size: 1.1rem; margin-bottom: 12px; border-bottom: 1px solid #d4af37; padding-bottom: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 5px; color: #ddd; }
        th, td { padding: 10px 4px; border-bottom: 1px solid #333333; text-align: center; }
        th { background-color: #222222; color: #d4af37; font-weight: bold; }
        .badge-win { background: #e53e3e; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-place { background: #319795; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-out { background: #4a5568; color: #ccc; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1> JRA公式連動 AI出馬表ポータル</h1>
        <div class="subtitle">PREMIUM製品版・指定レース出走馬一覧＆シミュレーター</div>
        <div class="lock-box">
            <input type="tel" id="password" class="pass-input" placeholder="🔑 パスワードを入力(7777)" maxlength="4">
        </div>
        <div class="selector-box">
            <div class="selector-title">🔍 出馬表を呼び出すレースを指定してください</div>
            <input type="tel" id="sim-date" class="text-input" value="20240526" maxlength="8">
            <select id="sim-venue" class="select-input">
                <option value="東京">東京競馬場</option>
                <option value="京都">京都競馬場</option>
            </select>
            <select id="sim-race" class="select-input">
                <option value="11R">11R (メインレース)</option>
                <option value="12R">12R (最終レース)</option>
            </select>
            <select id="sim-ticket" class="select-input">
                <option value="1">単勝馬券 (1着のみ払い戻し)</option>
                <option value="2">複勝馬券 (3着以内払い戻し)</option>
            </select>
            <input type="tel" id="sim-money" class="text-input" value="1000">
            <button id="predict-btn" class="btn-predict" onclick="loadOfficialRaceCard()">🧠 指定レースのAI出馬表を呼び出す</button>
        </div>
        <div class="result-report-card" id="report-card" style="display: none;">
            <div style="font-weight: bold; color: #d4af37; border-bottom: 1px solid #444; padding-bottom: 5px;">📊 このレースの仮想投資・収支結果</div>
            <div class="report-grid">
                <div class="report-item">総投資金額<div class="report-val" id="res-invest">0円</div></div>
                <div class="report-item">総払い戻し金額<div class="report-val" id="res-return">0円</div></div>
                <div class="report-item" style="grid-column: span 2; background: #1a1515; border-color: #d4af37;">
                    実際の純収支（利益）<div class="report-val" id="res-pure" style="font-size: 1.4rem; color: #d4af37;">+0円</div>
                </div>
            </div>
        </div>
        <div class="prediction-box">
            <div class="prediction-header" id="report-header-title">📋 AI出馬表パース待機中...</div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr><th>枠-馬</th><th>競走馬名(人気)</th><th>騎手</th><th>単勝オッズ</th><th>確定着順</th><th>収支結果</th></tr>
                    </thead>
                    <tbody id="predict-tbody">
                        <tr><td colspan="6" style="color:#666; padding:20px 0;">条件を指定し、上の赤いボタンを押してください</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        var SECRET_PASSWORD = "7777";
        function loadOfficialRaceCard() {
            if (document.getElementById("password").value.trim() !== SECRET_PASSWORD) {
                alert("❌ パスワードが違います"); return;
            }
            var condDate = document.getElementById("sim-date").value.trim();
            var condVenue = document.getElementById("sim-venue").value;
            var condRace = document.getElementById("sim-race").value;
            var condTicket = document.getElementById("sim-ticket").value;
            var condMoney = parseInt(document.getElementById("sim-money").value) || 1000;

            var db = [
                {date:"20240526", venue:"東京", race:"11R", waku:1, num:2, name:"レガレイラ", jockey:"北村宏", odds:4.2, pop:"2", order:5, tan:0, fuku:0},
                {date:"20240526", venue:"東京", race:"11R", waku:3, num:5, name:"ダノンデサイル", jockey:"横山典", odds:46.6, pop:"9", order:1, tan:4660, fuku:680},
                {date:"20240526", venue:"東京", race:"11R", waku:7, num:15, name:"ジャスティンミラノ", jockey:"戸崎圭", odds:2.2, pop:"1", order:2, tan:0, fuku:130},
                {date:"20240526", venue:"東京", race:"11R", waku:6, num:13, name:"シンエンペラー", jockey:"坂井瑠", odds:13.1, pop:"7", order:3, tan:0, fuku:280},
                {date:"20240526", venue:"東京", race:"12R", waku:4, num:7, name:"オメガウインク", jockey:"丸山元", odds:5.4, pop:"2", order:1, tan:540, fuku:190},
                {date:"20240526", venue:"東京", race:"12R", waku:1, num:1, name:"サトノエピック", jockey:"ルメール", odds:3.1, pop:"1", order:2, tan:0, fuku:150},
                {date:"20240526", venue:"京都", race:"11R", waku:2, num:4, name:"ドウデュース", jockey:"武豊", odds:1.8, pop:"1", order:1, tan:180, fuku:110},
                {date:"20240526", venue:"京都", race:"11R", waku:5, num:9, name:"キタサンブラック", jockey:"川田将", odds:6.5, pop:"3", order:3, tan:0, fuku:180}
            ];

            var html = ''; var t_bets = 0; var t_return = 0;
            for (var i = 0; i < db.length; i++) {
                var row = db[i];
                if (condDate !== row.date || condVenue !== row.venue || condRace !== row.race) continue;
                t_bets++;
                var pay = 0; var is_hit = false;
                if (condTicket === "1" || condTicket === "１") {
                    if (row.order === 1) { pay = Math.floor(condMoney * (row.tan / 100)); is_hit = true; }
                } else {
                    if (row.order <= 3) { pay = Math.floor(condMoney * (row.fuku / 100)); is_hit = true; }
                }
                t_return += pay;
                var badge = row.order === 1 ? '<span class="badge-win">1着</span>' : (row.order <= 3 ? '<span class="badge-place">' + row.order + '着</span>' : '<span class="badge-out">' + row.order + '着</span>');
                var profit = is_hit ? '<span style="color:#e53e3e;font-weight:bold;">的中!<br>+' + pay.toLocaleString() + '円</span>' : '<span style="color:#666;">不的中<br>0円</span>';
                html += '<tr><td>' + row.waku + '枠' + row.num + '番</td><td><b>' + row.name + '</b><br><small style="color:#999;">' + row.pop + '人気</small></td><td>' + row.jockey + '</td><td>' + row.odds.toFixed(1) + '倍</td><td>' + badge + '</td><td>' + profit + '</td></tr>';
            }
            if (t_bets === 0) { alert("❌ データが見つかりません"); return; }
            document.getElementById("predict-tbody").innerHTML = html;
            document.getElementById("res-invest").innerText = (t_bets * condMoney).toLocaleString() + "円";
            document.getElementById("res-return").innerText = t_return.toLocaleString() + "円";
            var pure = t_return - (t_bets * condMoney);
            document.getElementById("res-pure").innerText = (pure >= 0 ? "+" : "") + pure.toLocaleString() + "円";
            document.getElementById("report-card").style.display = "block";
            document.getElementById("report-header-title").innerText = "📋 " + condDate + " " + condVenue + condRace + " AI確定出馬表";
        }
    </script>
