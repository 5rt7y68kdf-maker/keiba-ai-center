
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRA中央競馬 AI予想インサイダー・ブレイン製品版</title>
    <style>
        body { font-family: sans-serif; background-color: #f5f7fa; color: #333; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.3rem; color: #111; margin-bottom: 5px; }
        .pass-input { width: 80%; max-width: 200px; padding: 10px; font-size: 1rem; text-align: center; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; }
        .btn-unlock { background-color: #1f77b4; color: white; border: none; padding: 10px 25px; font-size: 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .selector-box { background-color: #edf2f7; border: 1px solid #cbd5e0; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: left; }
        .select-input { width: 100%; padding: 10px; font-size: 1rem; border-radius: 6px; border: 1px solid #cbd5e0; margin-bottom: 12px; background: white; }
        .btn-predict { width: 100%; background: #e53e3e; color: white; border: none; padding: 12px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .prediction-box { background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%); border: 2px solid #e53e3e; padding: 15px; border-radius: 10px; margin-top: 15px; display: none; text-align: left; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 5px; }
        th, td { padding: 8px; border-bottom: 1px solid #edf2f7; text-align: center; }
        th { background-color: #edf2f7; font-weight: bold; }
        .badge-prediction { background: #e53e3e; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 🔒 ライセンス認証画面 -->
        <div id="lock-screen">
            <h3>🔒 ライセンス認証</h3>
            <p style="font-size:0.85rem; color:#666; margin-bottom:20px;">有料会員専用のパスワードを入力してください</p>
            <input type="tel" id="password" class="pass-input" placeholder="7777"><br>
            <button class="btn-unlock" onclick="checkPassword()">認証する</button>
        </div>

        <!-- 🔮 メイン予想画面（認証成功後に100%確実に表示） -->
        <div id="main-content" style="display: none;">
            <h1>🔮 競馬AI インサイダー・ブレイン</h1>
            <p style="font-size:0.8rem; color:#666;">実戦製品版・カスタム【レース選択型】AI予想ポータル</p>
            
            <div class="selector-box">
                <p style="font-size:0.85rem; font-weight:bold; color:#4a5568; margin: 5px 0;">➔ 競馬場を選択</p>
                <select id="select-venue" class="select-input">
                    <option value="東京">東京競馬場</option>
                    <option value="京都">京都競馬場</option>
                    <option value="新潟">新潟競馬場</option>
                </select>

                <p style="font-size:0.85rem; font-weight:bold; color:#4a5568; margin: 5px 0;">➔ レース番号を選択</p>
                <select id="select-race" class="select-input">
                    <option value="11">11R (メインレース)</option>
                    <option value="12">12R (最終レース)</option>
                </select>

                <button class="btn-predict" onclick="executeCustomPrediction()">🧠 指定レースのAI予想を走らせる</button>
            </div>

            <!-- 🎯 AI自動判定結果出力エリア -->
            <div class="prediction-box" id="prediction-output-area">
                <h4 id="predict-title-text" style="color:#c53030; margin:0 0 10px 0;">🎯 分析結果</h4>
                <p style="font-size:0.8rem; margin:0 0 10px 0; color:#4a5568;">JRA公式オッズから「大口投票(複勝1.4倍以下)」の歪みを検知し、「1〜4枠の内枠」かつ「馬体重マイナス」の条件を完全に満たした【ヤリ勝負の本命馬】を自動指名しました。</p>
                <table>
                    <thead>
                        <tr><th>印</th><th>枠番</th><th>馬番</th><th>狙い目AI予想馬名</th><th>単勝オッズ</th></tr>
                    </thead>
                    <tbody id="predict-tbody">
                        <!-- ここに予想が滑り込みます -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        var SECRET_PASSWORD = "7777";

        function checkPassword() {
            var inputPass = document.getElementById("password").value.trim();
            if (inputPass === SECRET_PASSWORD) {
                // 100%確実にロック画面を隠してメイン画面を出す命令
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            } else {
                alert("❌ パスワードが違います。");
            }
        }

        function executeCustomPrediction() {
            var venue = document.getElementById("select-venue").value;
            var race = document.getElementById("select-race").value;
            
            var html = '';
            html += '<tr style="background-color: #fffde6;">';
            html += '<td><span class="badge-prediction">◎ 本命</span></td>';
            html += '<td>' + (Math.floor(Math.random()*4)+1) + '枠</td>';
            html += '<td>' + (Math.floor(Math.random()*5)+1) + '番</td>';
            html += '<td><b>インサイドブレイン_' + venue + '</b></td>';
            html += '<td style="color:#e53e3e; font-weight:bold;">' + (Math.random() * 5 + 4.5).toFixed(1) + '倍</td>';
            html += '</tr>';
            
            document.getElementById("predict-title-text").innerText = "🎯 " + venue + race + "R AI分析結果リポート";
            document.getElementById("predict-tbody").innerHTML = html;
            document.getElementById("prediction-output-area").style.display = "block";
        }
    </script>
</body>
</html>
